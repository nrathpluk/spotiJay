<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotiJay — Music Player</title>
    <meta
      name="description"
      content="SpotiJay is a premium local music player"
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>

    <!-- ======= AUTH SCREEN ======= -->
    <div id="auth-screen">
      <div class="auth-orb auth-orb-1"></div>
      <div class="auth-orb auth-orb-2"></div>

      <div class="auth-card">
        <!-- Brand -->
        <div class="auth-brand">
          <svg class="auth-brand-icon" viewBox="0 0 24 24" fill="url(#ag)">
            <defs>
              <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8b5cf6" />
                <stop offset="100%" stop-color="#ec4899" />
              </linearGradient>
            </defs>
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
          </svg>
          SpotiJay
        </div>
        <p class="auth-tagline">Your music, your space.</p>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active">Sign In</button>
          <button id="tab-register" class="auth-tab">Register</button>
        </div>

        <!-- Error -->
        <div id="auth-error" class="auth-error"></div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
          <input id="login-username" type="text" class="auth-input" placeholder="Username" autocomplete="username" required />
          <input id="login-password" type="password" class="auth-input" placeholder="Password" autocomplete="current-password" required />
          <button id="login-btn" type="submit" class="auth-btn">Sign In</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" style="display:none">
          <input id="reg-username" type="text" class="auth-input" placeholder="Choose a username" autocomplete="username" required />
          <input id="reg-password" type="password" class="auth-input" placeholder="Password (min. 6 chars)" autocomplete="new-password" required />
          <input id="reg-confirm" type="password" class="auth-input" placeholder="Confirm password" autocomplete="new-password" required />
          <button id="register-btn" type="submit" class="auth-btn">Create Account</button>
        </form>
      </div>
    </div>
    <!-- ======= END AUTH SCREEN ======= -->

    <div id="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="url(#brand-grad)">
            <defs>
              <linearGradient
                id="brand-grad"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#8b5cf6" />
                <stop offset="100%" stop-color="#ec4899" />
              </linearGradient>
            </defs>
            <path
              d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"
            />
          </svg>
          SpotiJay
        </div>

        <div class="sidebar-menu">
          <h3 class="menu-heading">Your Library</h3>
          <ul class="nav-links">
            <li class="active">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
              </svg>
              All Tracks
            </li>
          </ul>
        </div>

        <div class="upload-section">
          <button id="upload-btn" class="upload-button">Upload Music</button>
          <input
            type="file"
            id="upload-m4a"
            accept=".m4a"
            multiple
            style="display: none"
          />

          <div id="drop-zone" class="drop-area">Or drop files here</div>
        </div>
      </aside>

      <!-- Main Area -->
      <main class="main-content">
        <header class="main-header">
          <div class="greeting">Good Evening</div>
          <div class="user-profile-area">
            <span id="user-badge" class="user-badge"></span>
            <button id="logout-btn" class="logout-btn" title="Sign out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </button>
          </div>
        </header>

        <section class="playlist-section">
          <div class="playlist-header">
            <div class="col index">#</div>
            <div class="col title">Title</div>
            <div class="col actions"></div>
          </div>

          <div id="playlist-empty" class="empty-state">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M9 18V5l12-2v13"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
            <h2>Your library is empty</h2>
            <p>Upload M4A files to start streaming.</p>
          </div>

          <ul id="playlist" class="playlist-list"></ul>
        </section>
      </main>

      <!-- Bottom Player bar -->
      <footer class="player-bar">
        <div class="now-playing">
          <div id="album-art" class="mini-art">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"
              />
            </svg>
          </div>
          <div class="song-meta">
            <!-- Compatibility hooks for player.js -->
            <div id="now-playing-label" style="display: none"></div>
            <div id="visualizer" style="display: none"></div>

            <div id="song-title" class="track-title">SpotiJay</div>
            <div id="song-subtitle" class="track-artist">
              Select a track to play
            </div>
          </div>
        </div>

        <div class="player-controls-container">
          <div class="controls-row">
            <button id="btn-prev" class="ctrl-btn" onclick="prev()">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
              </svg>
            </button>
            <button
              id="btn-play"
              class="ctrl-btn play-circle"
              onclick="togglePlay()"
            >
              <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="8,5 19,12 8,19" />
              </svg>
            </button>
            <button id="btn-next" class="ctrl-btn" onclick="next()">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M16 18h2V6h-2zm-8.5-6l8.5 6V6z"
                  transform="scale(-1,1) translate(-24,0)"
                />
              </svg>
            </button>
          </div>

          <div class="progress-row">
            <span id="current-time">0:00</span>
            <div class="scrubber">
              <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
                step="0.1"
              />
              <div id="progress-fill" class="scrubber-fill"></div>
            </div>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="volume-container">
          <button id="volume-btn" class="ctrl-btn" onclick="toggleMute()">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
              />
            </svg>
          </button>
          <div class="scrubber vol-scrubber">
            <input
              type="range"
              id="volume"
              min="0"
              max="1"
              step="0.01"
              value="1"
            />
            <div id="volume-fill" class="scrubber-fill"></div>
          </div>
        </div>
      </footer>

      <audio id="player"></audio>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/auth.js"></script>
    <script type="module" src="/src/player.js"></script>
  </body>
</html>
