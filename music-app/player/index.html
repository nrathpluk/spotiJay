<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotiJay — Music Player</title>
    <meta
      name="description"
      content="SpotiJay is a premium local music player with drag & drop support and beautiful dark UI."
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <button id="upload-btn">Upload M4A</button>

    <input
      type="file"
      id="upload-m4a"
      accept=".m4a"
      multiple
      style="display: none"
    />
    <div id="app">
      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">
              <!-- Premium Gold/Abstract Wave Logo -->
              <svg viewBox="0 0 24 24" fill="none">
                <circle
                  cx="12"
                  cy="12"
                  r="11"
                  stroke="url(#grad)"
                  stroke-width="2"
                />
                <path
                  d="M8 16V8l4 3 4-3v8"
                  stroke="url(#grad)"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <defs>
                  <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24">
                    <stop offset="0%" stop-color="#d4af37" />
                    <stop offset="100%" stop-color="#f3e5ab" />
                  </linearGradient>
                </defs>
              </svg>
            </div>
            <h1 class="logo-text">SpotiJay</h1>
          </div>
        </div>

        <!-- Drop Zone -->
        <div class="drop-zone" id="drop-zone">
          <div class="drop-zone-content">
            <svg class="drop-icon" viewBox="0 0 48 48" fill="none">
              <path
                d="M24 4v28M14 22l10 10 10-10"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M8 36v4a4 4 0 004 4h24a4 4 0 004-4v-4"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <p class="drop-text">Drop music files here</p>
            <p class="drop-subtext">or click to browse</p>
          </div>
          <input type="file" id="file-input" multiple accept="audio/*" />
        </div>

        <!-- Playlist -->
        <div class="playlist-section">
          <h3 class="section-title">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
              <path
                d="M9 18V5l12-2v13"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle
                cx="6"
                cy="18"
                r="3"
                stroke="currentColor"
                stroke-width="2"
              />
              <circle
                cx="18"
                cy="16"
                r="3"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
            Playlist
          </h3>
          <ul id="playlist" class="playlist"></ul>
          <div class="playlist-empty" id="playlist-empty">
            <p>No songs loaded</p>
            <p class="small">Drag & drop files to get started</p>
          </div>
        </div>
      </aside>

      <!-- ===== MAIN CONTENT ===== -->
      <main class="main-content">
        <div class="main-bg-glow"></div>

        <div class="now-playing-hero" id="hero">
          <div class="album-art" id="album-art">
            <div class="album-art-inner">
              <svg viewBox="0 0 120 120" fill="none">
                <circle
                  cx="60"
                  cy="60"
                  r="55"
                  stroke="rgba(255,255,255,0.1)"
                  stroke-width="2"
                />
                <circle
                  cx="60"
                  cy="60"
                  r="40"
                  stroke="rgba(255,255,255,0.06)"
                  stroke-width="1.5"
                />
                <circle cx="60" cy="60" r="20" fill="rgba(255,255,255,0.05)" />
                <circle cx="60" cy="60" r="6" fill="rgba(212,175,55,0.5)" />
                <path d="M52 45l20 15-20 15z" fill="rgba(255,255,255,0.2)" />
              </svg>
            </div>
            <div class="vinyl-ring"></div>
          </div>

          <div class="now-playing-info">
            <span class="now-playing-label" id="now-playing-label">
              <span class="pulse-dot"></span>
              Ready to play
            </span>
            <h2 class="song-title" id="song-title">SpotiJay</h2>
            <p class="song-subtitle" id="song-subtitle">
              Drop your music to start listening
            </p>
          </div>
        </div>

        <!-- Visualizer Bars (decorative) -->
        <div class="visualizer" id="visualizer">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </main>

      <!-- ===== BOTTOM PLAYER BAR ===== -->
      <footer class="player-bar" id="player-bar">
        <audio id="player"></audio>

        <!-- Song Info -->
        <div class="player-song-info">
          <div class="mini-album-art" id="mini-album-art">
            <svg viewBox="0 0 40 40" fill="none">
              <circle
                cx="20"
                cy="20"
                r="18"
                stroke="rgba(255,255,255,0.1)"
                stroke-width="1.5"
              />
              <circle cx="20" cy="20" r="5" fill="rgba(29,185,84,0.4)" />
              <path d="M17 15l8 5-8 5z" fill="rgba(255,255,255,0.3)" />
            </svg>
          </div>
          <div class="player-song-text">
            <span class="player-song-name" id="player-song-name"
              >No song playing</span
            >
            <span class="player-song-artist" id="player-song-artist">—</span>
          </div>
        </div>

        <!-- Controls -->
        <div class="player-controls">
          <div class="control-buttons">
            <button
              class="control-btn"
              id="btn-prev"
              title="Previous"
              onclick="prev()"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
              </svg>
            </button>
            <button
              class="control-btn play-btn"
              id="btn-play"
              title="Play"
              onclick="togglePlay()"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon">
                <polygon points="8,5 19,12 8,19" />
              </svg>
            </button>
            <button
              class="control-btn"
              id="btn-next"
              title="Next"
              onclick="next()"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M16 18h2V6h-2zm-8.5-6l8.5 6V6z"
                  transform="scale(-1,1) translate(-24,0)"
                />
              </svg>
            </button>
          </div>
          <div class="progress-container">
            <span class="time-label" id="current-time">0:00</span>
            <div class="progress-bar-wrapper">
              <input
                type="range"
                id="progress"
                class="progress-slider"
                value="0"
                min="0"
                max="100"
                step="0.1"
              />
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="time-label" id="duration">0:00</span>
          </div>
        </div>

        <!-- Volume -->
        <div class="player-volume">
          <button class="volume-btn" id="volume-btn" onclick="toggleMute()">
            <svg viewBox="0 0 24 24" fill="currentColor" id="volume-icon">
              <path
                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
              />
            </svg>
          </button>
          <div class="volume-slider-wrapper">
            <input
              type="range"
              id="volume"
              class="volume-slider"
              min="0"
              max="1"
              step="0.01"
              value="1"
            />
            <div class="volume-fill" id="volume-fill"></div>
          </div>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script src="/src/player.js"></script>
  </body>
</html>
